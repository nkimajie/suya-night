<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <meta name="theme-color" content="#120a06" />
  <title>Suya Night</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%94%A5%3C/text%3E%3C/svg%3E" />
  <style>
    html, body { margin: 0; height: 100%; background: #120a06; overflow: hidden;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; color: #f6e7d0; }
    canvas { display: block; }
    #overlay { position: fixed; left: 0; right: 0; bottom: 18px; display: flex;
      flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }
    #enter { pointer-events: auto; font: 600 18px system-ui, sans-serif; padding: 14px 26px;
      border-radius: 999px; border: 2px solid #ffb347; background: #2a1408; color: #ffd9a0;
      cursor: pointer; }
    #enter:disabled { opacity: .55; cursor: default; }
    #hint { font-size: 13px; opacity: .8; text-align: center; max-width: 560px; padding: 0 16px; }
  </style>
</head>
<body>
  <div id="overlay">
    <button id="enter" disabled>Checking for VR…</button>
    <div id="hint">Desktop test mode: click = pinch, drag the woven fan fast over the grill = fan the coals.</div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
